<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hikâye Yönetimi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>

<body class="bg-gray-50">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="dashboard.html" class="text-purple-600 hover:text-purple-700 mr-4">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <span class="text-xl font-bold text-gray-800">Hikâye Yönetimi</span>
                </div>
                <div class="flex items-center space-x-4">
                    <p class="text-sm font-semibold text-gray-800" id="userName">Yükleniyor...</p>
                    <button onclick="performLogout()" class="text-red-600 hover:text-red-700">
                        <i class="fas fa-sign-out-alt text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Hikâye Yönetimi</h1>
            <button onclick="showAddModal()" class="gradient-bg text-white px-6 py-3 rounded-lg hover:opacity-90">
                <i class="fas fa-plus mr-2"></i>Yeni Hikâye
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-md p-4 mb-6">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="flex items-center space-x-2 md:space-x-4 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                    <label class="font-semibold whitespace-nowrap">Sınıf:</label>
                    <button onclick="filterStories(null)"
                        class="filter-btn px-4 py-2 rounded-lg bg-purple-600 text-white whitespace-nowrap">Tümü</button>
                    <button onclick="filterStories(2)"
                        class="filter-btn px-4 py-2 rounded-lg bg-gray-200 whitespace-nowrap">2. Sınıf</button>
                    <button onclick="filterStories(3)"
                        class="filter-btn px-4 py-2 rounded-lg bg-gray-200 whitespace-nowrap">3. Sınıf</button>
                    <button onclick="filterStories(4)"
                        class="filter-btn px-4 py-2 rounded-lg bg-gray-200 whitespace-nowrap">4. Sınıf</button>
                </div>
                <div class="relative w-full md:w-64 mt-4 md:mt-0">
                    <input type="text" id="storySearch" placeholder="Hikâye ara..."
                        class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                </div>
            </div>
        </div>

        <div id="storiesContainer" class="space-y-4">
            <div class="text-center py-12">
                <i class="fas fa-spinner fa-spin text-4xl text-purple-600"></i>
                <p class="mt-4">Yükleniyor...</p>
            </div>
        </div>
    </div>

    <div id="storyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl max-w-3xl w-full mx-4">
            <div class="gradient-bg text-white p-6 rounded-t-xl">
                <h2 class="text-2xl font-bold" id="modalTitle">Yeni Hikâye</h2>
            </div>
            <form id="storyForm" class="p-6 space-y-4">
                <input type="hidden" id="storyId">
                <div>
                    <label class="block font-semibold mb-2">Başlık</label>
                    <input type="text" id="title" required class="w-full border-2 rounded-lg p-3">
                </div>
                <div>
                    <label class="block font-semibold mb-2">Sınıf</label>
                    <select id="gradeLevel" required class="w-full border-2 rounded-lg p-3">
                        <option value="">Seçiniz</option>
                        <option value="2">2. Sınıf</option>
                        <option value="3">3. Sınıf</option>
                        <option value="4">4. Sınıf</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold mb-2">Metin</label>
                    <textarea id="content" rows="8" required class="w-full border-2 rounded-lg p-3"></textarea>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" onclick="closeModal()" class="px-6 py-3 bg-gray-300 rounded-lg">İptal</button>
                    <button type="submit" class="px-6 py-3 gradient-bg text-white rounded-lg">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl max-w-md w-full mx-4 p-6">
            <h3 class="text-xl font-bold mb-4">Hikâyeyi Sil</h3>
            <p class="mb-6">Silmek istediğinizden emin misiniz?</p>
            <div class="flex justify-end space-x-4">
                <button onclick="closeDeleteModal()" class="px-6 py-3 bg-gray-300 rounded-lg">İptal</button>
                <button onclick="confirmDelete()" class="px-6 py-3 bg-red-600 text-white rounded-lg">Sil</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/search.js"></script>
    <script>
        if (!checkAuth()) window.location.href = '../login.html';
        const user = getCurrentUserInfo();
        if (user.rol !== 'yonetici' && user.rol !== 'ogretmen') {
            alert('Erişim yetkiniz yok!');
            window.location.href = '../login.html';
        }
        document.getElementById('userName').textContent = user.ad_soyad;

        let currentGrade = null;
        let storyToDelete = null;

        async function loadStories(searchTerm = null) {
            const container = document.getElementById('storiesContainer');

            if (searchTerm !== null || !container.children.length) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-spinner fa-spin text-4xl text-purple-600"></i>
                        <p class="mt-4">Yükleniyor...</p>
                    </div>
                `;
            }

            try {
                const stories = await API.getStories(currentGrade, searchTerm);

                if (stories.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-12 bg-gray-50 rounded-lg">
                            <i class="fas fa-book-open text-4xl text-gray-300 mb-4"></i>
                            <p class="text-gray-600">Hikâye bulunamadı.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = stories.map(story => `
                    <div class="bg-white border border-gray-200 rounded-lg p-4 flex items-center justify-between hover:shadow-md transition">
                        <div class="flex items-center space-x-4">
                            <div class="bg-purple-100 w-12 h-12 rounded-lg flex items-center justify-center">
                                <i class="fas fa-book text-purple-600 text-xl"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">${story.baslik}</h3>
                                <div class="flex space-x-3 text-sm text-gray-500">
                                    <span>${story.sinif_duzeyi}. Sınıf</span>
                                    <span>${story.kelime_sayisi || 0} kelime</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="window.location.href='../student/story-view.html?id=${story.id}'" 
                                class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg" title="Görüntüle">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button onclick="editStory(${story.id})" 
                                class="p-2 text-green-600 hover:bg-green-50 rounded-lg" title="Düzenle">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="window.location.href='../student/quiz.html?id=${story.id}'"
                                class="p-2 text-purple-600 hover:bg-purple-50 rounded-lg" title="Sınavı Gör">
                                <i class="fas fa-question-circle"></i>
                            </button>
                            <button onclick="deleteStory(${story.id})" 
                                class="p-2 text-red-600 hover:bg-red-50 rounded-lg" title="Sil">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error(error);
                container.innerHTML = '<p class="text-red-500 text-center">Yüklenirken hata oluştu</p>';
            }
        }

        function filterStories(grade) {
            currentGrade = grade;

            // Update buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-purple-600', 'text-white');
                btn.classList.add('bg-gray-200');
            });
            event.target.classList.remove('bg-gray-200');
            event.target.classList.add('bg-purple-600', 'text-white');

            const searchTerm = document.getElementById('storySearch').value;
            loadStories(searchTerm);
        }

        function showAddModal() {
            document.getElementById('modalTitle').textContent = 'Yeni Hikâye';
            document.getElementById('storyForm').reset();
            document.getElementById('storyId').value = '';
            document.getElementById('storyModal').classList.remove('hidden');
            document.getElementById('storyModal').classList.add('flex');
        }

        async function editStory(id) {
            try {
                const story = await API.getStory(id);
                document.getElementById('modalTitle').textContent = 'Düzenle';
                document.getElementById('storyId').value = story.id;
                document.getElementById('title').value = story.baslik;
                document.getElementById('gradeLevel').value = story.sinif_duzeyi;
                document.getElementById('content').value = story.metin;
                document.getElementById('storyModal').classList.remove('hidden');
                document.getElementById('storyModal').classList.add('flex');
            } catch (error) {
                console.error(error);
                alert('Hikâye yüklenirken hata oluştu');
            }
        }

        function closeModal() {
            document.getElementById('storyModal').classList.add('hidden');
            document.getElementById('storyModal').classList.remove('flex');
        }

        function deleteStory(id) {
            showDeleteModal(id);
        }

        function showDeleteModal(id) {
            storyToDelete = id;
            document.getElementById('deleteModal').classList.remove('hidden');
            document.getElementById('deleteModal').classList.add('flex');
        }

        function closeDeleteModal() {
            storyToDelete = null;
            document.getElementById('deleteModal').classList.add('hidden');
            document.getElementById('deleteModal').classList.remove('flex');
        }

        async function confirmDelete() {
            if (!storyToDelete) return;
            try {
                await API.deleteStory(storyToDelete);
                alert('Silindi!');
                closeDeleteModal();
                loadStories();
            } catch (error) {
                console.error(error);
                alert('Hata!');
            }
        }

        document.getElementById('storyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const storyId = document.getElementById('storyId').value;
            const data = {
                baslik: document.getElementById('title').value,
                sinif_duzeyi: parseInt(document.getElementById('gradeLevel').value),
                metin: document.getElementById('content').value
            };

            try {
                if (storyId) {
                    await API.updateStory(storyId, data);
                } else {
                    await API.createStory(data);
                }
                alert('Kaydedildi!');
                closeModal();
                loadStories();
            } catch (error) {
                console.error(error);
                alert('Hata!');
            }
        });

        // Initialize search
        SearchUtils.setupSearch('storySearch', (value) => {
            loadStories(value);
        });

        loadStories();
    </script>
</body>

</html>

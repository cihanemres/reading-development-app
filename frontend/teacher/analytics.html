<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınıf Analizi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .chart-container {
            position: relative;
            height: 300px;
        }
    </style>
</head>

<body class="bg-gray-50">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="dashboard.html" class="text-purple-600 hover:text-purple-700 mr-4">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <span class="text-xl font-bold text-gray-800">Sınıf Analizi</span>
                </div>
                <div class="flex items-center space-x-4">
                    <p class="text-sm font-semibold text-gray-800" id="userName">Yükleniyor...</p>
                    <button onclick="window.location.href='../profile.html'"
                        class="text-purple-600 hover:text-purple-700">
                        <i class="fas fa-user-cog text-xl"></i>
                    </button>
                    <button onclick="performLogout()" class="text-red-600 hover:text-red-700">
                        <i class="fas fa-sign-out-alt text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Grade Filter -->
        <div class="bg-white rounded-xl shadow-md p-4 mb-6">
            <div class="flex items-center space-x-4">
                <label class="font-semibold">Sınıf Seviyesi:</label>
                <button onclick="filterByGrade(null)"
                    class="grade-btn px-4 py-2 rounded-lg bg-purple-600 text-white">Tümü</button>
                <button onclick="filterByGrade(2)" class="grade-btn px-4 py-2 rounded-lg bg-gray-200">2. Sınıf</button>
                <button onclick="filterByGrade(3)" class="grade-btn px-4 py-2 rounded-lg bg-gray-200">3. Sınıf</button>
                <button onclick="filterByGrade(4)" class="grade-btn px-4 py-2 rounded-lg bg-gray-200">4. Sınıf</button>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Toplam Öğrenci</p>
                        <p class="text-3xl font-bold text-purple-600" id="totalStudents">0</p>
                    </div>
                    <i class="fas fa-users text-4xl text-purple-200"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Tamamlanan Hikâye</p>
                        <p class="text-3xl font-bold text-blue-600" id="totalCompletions">0</p>
                    </div>
                    <i class="fas fa-book-open text-4xl text-blue-200"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Ortalama Puan</p>
                        <p class="text-3xl font-bold text-green-600" id="avgScore">0</p>
                    </div>
                    <i class="fas fa-chart-line text-4xl text-green-200"></i>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid md:grid-cols-2 gap-6 mb-8">
            <!-- Student Comparison Chart -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h3 class="text-xl font-bold mb-4">Öğrenci Karşılaştırması</h3>
                <div class="chart-container">
                    <canvas id="studentComparisonChart"></canvas>
                </div>
            </div>

            <!-- Performance Distribution -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h3 class="text-xl font-bold mb-4">Performans Dağılımı</h3>
                <div class="chart-container">
                    <canvas id="performanceDistributionChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Detailed Stats Table -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <h3 class="text-xl font-bold mb-4">Detaylı İstatistikler</h3>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left">Öğrenci</th>
                            <th class="px-4 py-3 text-left">Sınıf</th>
                            <th class="px-4 py-3 text-center">Tamamlanan</th>
                            <th class="px-4 py-3 text-center">Quiz Ort.</th>
                            <th class="px-4 py-3 text-center">Akıcılık</th>
                            <th class="px-4 py-3 text-center">Anlama</th>
                        </tr>
                    </thead>
                    <tbody id="statsTableBody">
                        <tr>
                            <td colspan="6" class="text-center py-8 text-gray-500">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/chart_utils.js"></script>
    <script>
        if (!checkAuth()) window.location.href = '../login.html';
        const user = getCurrentUserInfo();
        if (user.rol !== 'ogretmen') {
            alert('Erişim yetkiniz yok!');
            window.location.href = '../login.html';
        }
        document.getElementById('userName').textContent = user.ad_soyad;

        let currentGrade = null;
        let comparisonChart = null;
        let distributionChart = null;

        async function loadAnalytics() {
            try {
                const token = localStorage.getItem('token');
                const url = currentGrade
                    ? `http://localhost:8000/api/teacher/analytics/class-summary?sinif_duzeyi=${currentGrade}`
                    : 'http://localhost:8000/api/teacher/analytics/class-summary';

                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                // Update summary cards
                document.getElementById('totalStudents').textContent = data.class_summary.total_students;
                document.getElementById('totalCompletions').textContent = data.class_summary.total_completions;
                document.getElementById('avgScore').textContent = data.class_summary.average_score.toFixed(1);

                // Update charts
                updateCharts(data.student_stats);

                // Update table
                updateTable(data.student_stats);
            } catch (error) {
                console.error(error);
                alert('Veriler yüklenirken hata oluştu!');
            }
        }

        function updateCharts(studentStats) {
            if (studentStats.length === 0) {
                // Show "no data" message instead of charts
                document.getElementById('studentComparisonChart').parentElement.innerHTML = 
                    '<div class="flex items-center justify-center h-full"><p class="text-gray-500">Henüz veri yok. Öğrenciler hikaye tamamladıkça burada görünecek.</p></div>';
                document.getElementById('performanceDistributionChart').parentElement.innerHTML = 
                    '<div class="flex items-center justify-center h-full"><p class="text-gray-500">Henüz veri yok. Öğrenciler hikaye tamamladıkça burada görünecek.</p></div>';
                return;
            }

            // Student Comparison Chart
            const names = studentStats.map(s => s.name.split(' ')[0]); // First name only
            const avgScores = studentStats.map(s => s.avg_quiz_score);

            if (comparisonChart) comparisonChart.destroy();
            comparisonChart = ChartUtils.createComparisonBarChart(
                'studentComparisonChart',
                names,
                avgScores,
                'Ortalama Puan'
            );

            // Performance Distribution (by score ranges)
            const ranges = ['0-25', '26-50', '51-75', '76-100'];
            const distribution = [0, 0, 0, 0];
            studentStats.forEach(s => {
                const score = s.avg_quiz_score;
                if (score <= 25) distribution[0]++;
                else if (score <= 50) distribution[1]++;
                else if (score <= 75) distribution[2]++;
                else distribution[3]++;
            });

            if (distributionChart) distributionChart.destroy();
            distributionChart = ChartUtils.createDoughnutChart(
                'performanceDistributionChart',
                ranges,
                distribution
            );
        }

        function updateTable(studentStats) {
            const tbody = document.getElementById('statsTableBody');
            if (studentStats.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-500">Veri yok</td></tr>';
                return;
            }

            tbody.innerHTML = studentStats.map(s => `
                <tr class="border-t hover:bg-gray-50">
                    <td class="px-4 py-3">${s.name}</td>
                    <td class="px-4 py-3">${s.grade}. Sınıf</td>
                    <td class="px-4 py-3 text-center">${s.completed_stories}</td>
                    <td class="px-4 py-3 text-center">${s.avg_quiz_score}</td>
                    <td class="px-4 py-3 text-center">${s.avg_fluency || '-'}</td>
                    <td class="px-4 py-3 text-center">${s.avg_comprehension || '-'}</td>
                </tr>
            `).join('');
        }

        function filterByGrade(grade) {
            currentGrade = grade;
            document.querySelectorAll('.grade-btn').forEach(btn => {
                btn.classList.remove('bg-purple-600', 'text-white');
                btn.classList.add('bg-gray-200');
            });
            event.target.classList.remove('bg-gray-200');
            event.target.classList.add('bg-purple-600', 'text-white');
            loadAnalytics();
        }

        loadAnalytics();
    </script>
</body>

</html>

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: okuma_db
    environment:
      POSTGRES_USER: okuma_user
      POSTGRES_PASSWORD: okuma_password
      POSTGRES_DB: okuma_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okuma_user -d okuma_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: okuma_backend
    environment:
      DATABASE_URL: postgresql://okuma_user:okuma_password@postgres:5432/okuma_db
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DEBUG: "True"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./static:/app/static
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: okuma_db
    environment:
      POSTGRES_USER: okuma_user
      POSTGRES_PASSWORD: okuma_password
      POSTGRES_DB: okuma_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U okuma_user -d okuma_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - okuma_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: okuma_backend
    environment:
      DATABASE_URL: postgresql://okuma_user:okuma_password@postgres:5432/okuma_db
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DEBUG: "False"
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - okuma_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: okuma_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - okuma_network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:


networks:
  okuma_network:
    driver: bridge
